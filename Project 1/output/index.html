<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FWN Validations Test Function 4 Terminal</title>
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/vendor/tabulator-5.5.0.min.css">
    <style>
        body { padding: 0; letter-spacing: 0; }
        body * { letter-spacing: 0; }
        .terminal-header { display: flex; gap: 24px; align-items: center; padding: 24px 32px; border-bottom: 3px solid var(--primary-color); background: var(--bg-card); }
        .terminal-header img { width: 76px; height: 52px; object-fit: contain; background: var(--primary-dark); border-radius: 4px; }
        .terminal-header h1 { font-size: 23px; line-height: 1.3; margin: 0; max-width: 670px; color: var(--text-color); text-shadow: none; }
        .terminal-header p { color: var(--text-muted); margin: 5px 0 0; }
        .refresh-meta { margin-left: auto; font-size: 12px; line-height: 1.7; text-align: right; }
        .refresh-meta .action { margin-top: 6px; }
        #refresh-status { display: block; max-width: 320px; overflow-wrap: anywhere; }
        .dashboard-tabs { position: static; margin: 0; padding: 12px 32px; border-radius: 0; flex-wrap: wrap; gap: 12px; }
        .utility-selector { display: grid; gap: 5px; min-width: 0; max-width: 100%; font-size: 12px; color: var(--text-muted); }
        .utility-selector select { width: 300px; max-width: 100%; min-height: 40px; padding: 6px 9px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-card); color: var(--text-color); font: inherit; }
        #dashboard-content { padding: 0 32px 28px; }
        .charts-grid { display: block; }
        .controls-band { padding: 22px 0 16px; border-bottom: 1px solid var(--border-color); }
        .eyebrow { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .line-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .line-buttons button, .action { border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); border-radius: 4px; padding: 8px 12px; min-height: 36px; font: inherit; cursor: pointer; }
        .line-buttons button[aria-pressed="true"] { background: var(--primary-color); color: var(--text-inverse); border-color: var(--primary-color); }
        .audit-content-buttons { max-height: 180px; overflow: auto; padding: 4px; }
        .audit-content-buttons button { max-width: 100%; overflow-wrap: anywhere; text-align: left; }
        .control-row { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
        .control-row label { display: grid; gap: 5px; font-size: 12px; color: var(--text-muted); }
        .control-row select, .control-row input[type="text"] { min-height: 36px; padding: 6px 9px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); border-radius: 4px; font: inherit; }
        .control-row input[type="text"] { width: 132px; }
        .control-row .check { display: flex; align-items: center; min-height: 36px; }
        .control-row .downloads { margin-left: auto; display: flex; gap: 6px; }
        .date-range { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
        .date-range label { display: grid; gap: 4px; color: var(--text-muted); font-size: 12px; }
        input[type="range"] { width: 100%; accent-color: var(--primary-color); }
        .quality-band { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--color-warning); background: var(--bg-secondary); line-height: 1.6; font-size: 12px; }
        .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border-color); padding: 4px 0 20px; gap: 20px; }
        .metric { min-width: 0; }
        .metric h3 { font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 0 0 8px; }
        .metric strong { display: block; font-size: 25px; font-weight: 600; overflow-wrap: anywhere; }
        .metric small { display: block; margin-top: 6px; color: var(--text-muted); line-height: 1.5; }
        .acceptance { grid-column: span 2; min-width: 0; }
        .acceptance h3 { font-size: 14px; margin: 0 0 8px; }
        .acceptance-list { max-height: 210px; overflow: auto; padding-right: 8px; }
        .acceptance-entry { padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
        .acceptance-entry strong { display: block; font-size: 13px; }
        .acceptance-entry ul { padding-left: 18px; margin: 4px 0; }
        .acceptance small { color: var(--text-muted); font-size: 11px; }
        .visuals { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; padding: 22px 0; }
        .visuals section { min-width: 0; }
        .section-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        h2 { font-size: 16px; margin: 0; font-weight: 600; }
        .info { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); font: bold 12px Georgia, serif; cursor: help; }
        .plot { height: 310px; min-width: 0; }
        .legend, .selection-note { font-size: 12px; color: var(--text-muted); margin: 8px 0; line-height: 1.5; }
        .insights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 18px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .insights h3 { font-size: 12px; margin: 0 0 8px; color: var(--primary-color); }
        .insights p { margin: 0; font-size: 12px; line-height: 1.7; }
        .table-band { padding-top: 20px; }
        .table-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .table-heading .action { margin-left: auto; }
        .tabulator { font-size: 12px; background: var(--bg-card); color: var(--text-color); border-color: var(--border-color); }
        .tabulator .tabulator-header, .tabulator .tabulator-header .tabulator-col, .tabulator .tabulator-footer { background: var(--bg-secondary); color: var(--text-color); border-color: var(--border-color); }
        .tabulator .tabulator-row { background: var(--bg-card); color: var(--text-color); }
        .tabulator .tabulator-row:nth-child(even) { background: var(--bg-secondary); }
        .tabulator .tabulator-row.tabulator-selected { outline: 2px solid var(--primary-color); outline-offset: -2px; }
        .tabulator input { color: var(--text-color); background: var(--bg-card); border: 1px solid var(--border-color); max-width: 100%; }
        .tabulator .tabulator-footer .tabulator-page { color: var(--text-color); }
        .tabulator-row.quality-row { border-left: 4px solid var(--color-warning); }
        dialog { width: min(780px, calc(100% - 32px)); max-height: 85vh; padding: 24px; background: var(--bg-card); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; }
        dialog::backdrop { background: var(--bg-overlay); }
        dialog header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
        dialog dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; font-size: 13px; }
        dialog dt { color: var(--text-muted); }
        dialog dd { margin: 0; overflow-wrap: anywhere; }
        .footer { border-radius: 0; font-size: 12px; }
        .empty { display: grid; place-items: center; color: var(--text-muted); text-align: center; }
        :focus-visible { outline: 3px solid var(--focus-color); outline-offset: 3px; }
        @media (max-width: 800px) {
            .terminal-header { padding: 16px; flex-wrap: wrap; gap: 12px; }
            .terminal-header h1 { font-size: 19px; }
            .terminal-header > div:nth-child(2) { flex: 1; }
            .refresh-meta { width: 100%; text-align: left; margin: 0; }
            #dashboard-content { padding: 0 16px 20px; }
            .dashboard-tabs { padding: 12px 16px; }
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .visuals, .insights { grid-template-columns: 1fr; }
            .control-row .downloads { margin-left: 0; }
            .date-range { grid-template-columns: 1fr; gap: 8px; }
            dialog dl { grid-template-columns: 1fr; gap: 5px; }
            dialog dd { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <header class="terminal-header">
        <img src="assets/images/ST_logo.png" alt="Alcon Smart Technology">
        <div><h1 id="dashboard-title">FWN Validations Test Function 4 Terminal</h1><p id="dashboard-subtitle">Fort Worth North | Water quality</p></div>
        <div class="refresh-meta"><strong>Refresh Date</strong><br><time id="refresh-date"></time><br><span id="snapshot-label"></span><br><button class="action" id="refresh-data" type="button" title="Re-query production samples and linked specifications">&#8635; Refresh</button><span id="refresh-status" role="status" aria-live="polite"></span></div>
    </header>
    <nav class="dashboard-tabs" aria-label="Utility and cycle audit views">
        <label class="utility-selector" for="utility-select">Critical Utility<select id="utility-select"></select></label>
        <label class="utility-selector" for="sterilizer-select">Sterilizers<select id="sterilizer-select" aria-controls="audit-view"></select></label>
        <label class="utility-selector" for="oven-select">Ovens<select id="oven-select" aria-controls="audit-view"></select></label>
        <div class="display-controls"><button id="theme-toggle" class="display-icon-btn" type="button" aria-label="Switch theme" title="Switch theme"><span aria-hidden="true"></span></button></div>
    </nav>
    <main id="dashboard-content"></main>
    <dialog id="sample-detail" aria-labelledby="sample-title">
        <header><h2 id="sample-title">Sample detail</h2><button class="action" id="close-detail" aria-label="Close details" title="Close details">&#215;</button></header>
        <dl id="sample-fields"></dl>
        <button class="action" id="drill-line">View this sampling location</button>
    </dialog>
    <footer class="footer">Smart Technology Team | Alcon | Production snapshot | <span id="current-year"></span></footer>
    <script src="assets/vendor/apexcharts-3.54.1.min.js"></script>
    <script src="assets/vendor/papaparse-5.4.1.min.js"></script>
    <script src="assets/vendor/tabulator-5.5.0.min.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/filters.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="data/water-results.js"></script>
    <script src="data/cycle-audits.js"></script>
    <script id="terminal-logic">
    'use strict';
    let SOURCE = window.FWN_WATER;
    let AUDITS = window.FWN_AUDITS;
    const DASHBOARD_CONFIG = {
        title: 'FWN Validations Test Function 4 Terminal',
        subtitle: 'Fort Worth North | Utilities and cycle audits',
        refreshDate: SOURCE.metadata.extractedAt,
        tabs: [{id: 'WFI', label: 'Water for Injection'}, {id: 'PW', label: 'Purified Water'},
            {id: 'CS-North', label: 'Clean Steam North'}, {id: 'CS-South', label: 'Clean Steam South'},
            {id: 'Pretreatment-North', label: 'North Pretreatment'}, {id: 'Pretreatment-South', label: 'South Pretreatment'},
            {id: 'PW-South', label: 'South PW Generation Systems'}],
        filters: [], data: SOURCE
    };
    const utilityOptions = [...DASHBOARD_CONFIG.tabs].sort((left, right) => left.label.localeCompare(right.label, 'en', {sensitivity: 'base'}));
    const esc = DashboardUtils.escHtml;
    const DAY = 86400000;
    const timestamp = date => Date.parse(date + 'T00:00:00Z');
    const iso = date => date.toISOString().slice(0, 10);
    const number = value => value === null || !Number.isFinite(value) ? 'N/A' : value.toLocaleString('en-US', {maximumFractionDigits: 4});
    const percent = (numerator, denominator) => denominator ? (100 * numerator / denominator).toFixed(1) + '%' : 'N/A';
    const states = {};
    const categoricalTests = new Set(['Nitrates', 'Coliforms', 'Color', 'Clarity']);
    const categoriesFor = rows => [...new Set(rows.filter(row => !row.missing).map(row => row.raw))].sort();
    const mean = rows => {
        const values = rows.filter(row => row.value !== null && !row.censored).map(row => row.value);
        return values.length ? values.reduce((total, value) => total + value, 0) / values.length : null;
    };
    function validDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const parsed = timestamp(value);
        return Number.isFinite(parsed) && iso(new Date(parsed)) === value;
    }
    function defaultDates(today = new Date()) {
        const end = iso(today);
        const start = new Date(timestamp(end));
        const month = start.getUTCMonth();
        start.setUTCFullYear(start.getUTCFullYear() - 2);
        if (start.getUTCMonth() !== month) start.setUTCDate(0);
        return {start: iso(start), end};
    }
    function selectRows(water, state, withDates = true) {
        return SOURCE.rows.filter(row => row.water === water && state.lines.includes(row.line) && row.test === state.test && row.units === state.units
            && (!state.collectionOnly || Boolean(row.collectedAt))
            && (!state.released || row.released) && (!withDates || row.date >= state.start && row.date <= state.end));
    }
    function changeText(current, previous) {
        if (current === null || previous === null) return 'N/A';
        const delta = current - previous;
        return (delta > 0 ? '+' : '') + number(delta) + (previous !== 0 ? ' (' + (delta / previous * 100).toFixed(1) + '%)' : ' (baseline zero)');
    }
    function periodComparisons(water, state) {
        const history = selectRows(water, state, false);
        const end = timestamp(state.end) + DAY;
        return [['WoW', 7], ['MoM', 30], ['QoQ', 90], ['YoY', 365]].map(([label, days]) => {
            const cut = end - days * DAY;
            const current = mean(history.filter(row => timestamp(row.date) >= cut && timestamp(row.date) < end));
            const previous = mean(history.filter(row => timestamp(row.date) >= cut - days * DAY && timestamp(row.date) < cut));
            return label + ': ' + changeText(current, previous);
        }).join(' | ');
    }
    function info(text) { return '<button class="info" type="button" title="' + esc(text) + '" aria-label="' + esc(text) + '">i</button>'; }
    function setup(water, previous) {
        const rows = SOURCE.rows.filter(row => row.water === water);
        const lines = [...new Set(rows.map(row => row.line))].sort();
        const preferred = water === 'WFI' ? 'North WFI Loop (272)' : water === 'PW-South' ? 'Line 10 (1001)' : 'Line 16 HPWS (530)';
        const dates = defaultDates();
        const state = states[water] = {lines: lines.length ? [lines.includes(preferred) ? preferred : lines[0]] : [], test: water === 'Pretreatment-North' ? 'Coliforms' : 'TOC', units: water === 'Pretreatment-North' ? 'Not supplied' : 'ppb', ...dates, released: true, collectionOnly: false, month: null, ...previous, hiddenSamples: new Set(), selected: null, chart: null, bars: null, table: null};
        state.lines = state.lines.filter(line => lines.includes(line));
        const grid = document.getElementById(water + '-grid');
        grid.innerHTML = `
            <section class="controls-band" aria-label="${water} selection">
                <div class="table-heading"><div class="eyebrow">SAMPLING LOCATIONS</div><button class="action" id="${water}-select-all" type="button">Select All</button></div><div class="line-buttons" id="${water}-lines" role="group" aria-label="Selected sampling locations"></div>
                <div class="control-row">
                    <label>Test / unit<select id="${water}-test"></select></label>
                    <label>Date basis<select id="${water}-date-basis"><option value="event">Collection, otherwise event date</option><option value="collection">Collection date only</option></select></label>
                    <label>Month<select id="${water}-month"><option value="">All selected dates</option></select></label>
                    <label>From (YYYY-MM-DD)<input type="text" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" maxlength="10" id="${water}-start" value="${state.start}" required></label>
                    <label>Through (YYYY-MM-DD)<input type="text" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" maxlength="10" id="${water}-end" value="${state.end}" required></label>
                    <button class="action" id="${water}-reset">Last two years</button>
                    <label class="check"><input type="checkbox" id="${water}-released" checked>Released results only</label>
                    <div class="downloads"><button class="action" id="${water}-csv" title="Download current table as CSV">&#8595; CSV</button><button class="action" id="${water}-json" title="Download current table and provenance as JSON">&#8595; JSON</button></div>
                </div>
                <div class="date-range"><label>Range start <input type="range" id="${water}-from-slider" aria-label="${water} range start"></label><label>Range end <input type="range" id="${water}-to-slider" aria-label="${water} range end"></label></div>
                <p class="selection-note" id="${water}-range" aria-live="polite"></p>
            </section>
            <aside class="quality-band" id="${water}-quality"></aside>
            <section class="metrics" id="${water}-metrics" aria-label="Selected result metrics"></section>
            <div class="visuals">
                <section><div class="section-heading"><h2 id="${water}-trend-title">Sample trend</h2>${info('Collection date when present; otherwise LIMS event date in the combined mode. Event date is not a verified collection date. One test and unit per graph; reported bounds are not exact measurements. Right-click a point to hide it from this graph only.')}<button class="action" id="${water}-restore-samples" type="button" hidden>Show all hidden samples</button></div><div class="plot" id="${water}-trend"></div><p class="selection-note" id="${water}-hidden-note" role="status"></p><p class="legend" id="${water}-legend"></p></section>
                <section><div class="section-heading"><h2>Monthly result count</h2>${info('Combined counts for the selected test and sampling locations. A month selection filters the trend, metrics and table; percentages use the full selected date range.')}</div><div class="plot" id="${water}-monthly"></div><p class="legend" id="${water}-monthly-note"></p></section>
            </div>
            <section class="insights" id="${water}-insights"></section>
            <section class="table-band"><div class="table-heading"><h2>Source results</h2>${info('One source result per row. Trend date uses collection date, otherwise event date. Both original timestamps and date basis are preserved. Creation date is never used. Blank values remain missing.')}
                <span id="${water}-table-count" class="selection-note"></span><button class="action" id="${water}-clear">Clear selection and table filters</button></div><div id="${water}-table"></div></section>`;
        const lineHost = document.getElementById(water + '-lines');
        for (const line of lines) {
            const button = document.createElement('button');
            button.textContent = line;
            button.type = 'button';
            button.setAttribute('aria-pressed', String(state.lines.includes(line)));
            button.addEventListener('click', () => setLine(water, line, true));
            lineHost.appendChild(button);
        }
        state.table = new Tabulator('#' + water + '-table', {
            height: 385, layout: 'fitDataStretch', pagination: true, paginationSize: 20,
            paginationSizeSelector: [20, 50, 100], selectable: 1, index: 'id',
            placeholder: 'No source results in this selection',
            initialSort: [{column: 'sampleAt', dir: 'desc'}],
            rowFormatter: row => row.getElement().classList.toggle('quality-row', row.getData().missing || !row.getData().released),
            columns: [
                {title: 'Detail', field: 'detail', width: 72, headerSort: false, formatter: () => '<button class="action" title="Open sample detail" aria-label="Open sample detail">&#8599;</button>', cellClick: (event, cell) => openSample(water, cell.getRow().getData())},
                {title: 'Trend date', field: 'sampleAt', width: 188, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Date basis', field: 'dateBasis', width: 220, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Sample', field: 'sampleId', width: 170, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Sampling location', field: 'line', width: 190, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Result', field: 'raw', width: 110, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Units', field: 'units', width: 100, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Test', field: 'test', width: 175, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Point', field: 'point', width: 135, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Released', field: 'released', width: 100, headerFilter: 'input', formatter: 'plaintext'},
                {title: 'Status', field: 'status', width: 125, headerFilter: 'input', formatter: 'plaintext'}
            ]
        });
        state.table.on('tableBuilt', () => render(water));
        state.table.on('dataFiltered', (filters, rows) => { document.getElementById(water + '-table-count').textContent = rows.length + ' visible rows'; });
        document.getElementById(water + '-restore-samples').addEventListener('click', () => {
            state.hiddenSamples.clear();
            drawTrend(water, state.visible);
        });
        document.getElementById(water + '-test').addEventListener('change', event => {
            [state.test, state.units] = JSON.parse(event.target.value); state.month = null; render(water);
        });
        document.getElementById(water + '-month').addEventListener('change', event => { state.month = event.target.value || null; render(water); });
        document.getElementById(water + '-date-basis').addEventListener('change', event => { state.collectionOnly = event.target.value === 'collection'; state.month = null; render(water); });
        for (const part of ['start', 'end']) document.getElementById(water + '-' + part).addEventListener('change', event => {
            if (!validDate(event.target.value)) {
                event.target.setCustomValidity('Enter a valid calendar date in YYYY-MM-DD format.');
                event.target.reportValidity();
                return;
            }
            event.target.setCustomValidity('');
            state[part] = event.target.value;
            if (state.start > state.end) state[part === 'start' ? 'end' : 'start'] = state[part];
            state.month = null; syncDates(water); render(water);
        });
        for (const [name, part] of [['from', 'start'], ['to', 'end']]) document.getElementById(water + '-' + name + '-slider').addEventListener('input', event => {
            state[part] = iso(new Date(Number(event.target.value) * DAY));
            if (state.start > state.end) state[part === 'start' ? 'end' : 'start'] = state[part];
            state.month = null; syncDates(water); render(water);
        });
        document.getElementById(water + '-reset').addEventListener('click', () => { Object.assign(state, defaultDates(), {month: null}); syncDates(water); render(water); });
        document.getElementById(water + '-released').addEventListener('change', event => { state.released = event.target.checked; render(water); });
        document.getElementById(water + '-clear').addEventListener('click', () => { state.month = null; state.selected = null; state.table.clearHeaderFilter(); state.table.deselectRow(); render(water); });
        for (const format of ['csv', 'json']) document.getElementById(water + '-' + format).addEventListener('click', () => download(water, format));
        document.getElementById(water + '-select-all').addEventListener('click', () => {
            state.lines = [...lines];
            state.month = null; state.selected = null;
            for (const button of lineHost.children) button.setAttribute('aria-pressed', 'true');
            state.table.clearHeaderFilter(); updateTests(water); render(water);
        });
        document.getElementById(water + '-released').checked = state.released;
        document.getElementById(water + '-date-basis').value = state.collectionOnly ? 'collection' : 'event';
        updateTests(water); syncDates(water);
    }
    function setLine(water, line, toggle = false) {
        const state = states[water];
        state.lines = toggle ? (state.lines.includes(line) ? state.lines.filter(selected => selected !== line) : [...state.lines, line]) : [line];
        state.month = null; state.selected = null;
        for (const button of document.getElementById(water + '-lines').children) button.setAttribute('aria-pressed', String(state.lines.includes(button.textContent)));
        state.table.clearHeaderFilter(); updateTests(water); render(water);
    }
    function updateTests(water) {
        const state = states[water];
        const options = [...new Set(SOURCE.rows.filter(row => row.water === water).map(row => JSON.stringify([row.test, row.units])))];
        let selected = JSON.stringify([state.test, state.units]);
        if (!options.length) options.push(selected);
        if (!options.includes(selected)) selected = options[0];
        [state.test, state.units] = JSON.parse(selected);
        const select = document.getElementById(water + '-test');
        select.replaceChildren(...options.map(key => { const option = document.createElement('option'); option.value = key; option.textContent = JSON.parse(key).join(' / '); return option; }));
        select.value = selected;
    }
    function syncDates(water) {
        const state = states[water];
        for (const part of ['start', 'end']) {
            const field = document.getElementById(water + '-' + part);

                button.onclick = () => {
                    const selected = state.contents ?? options;
                    state.contents = selected.includes(content) ? selected.filter(value => value !== content) : [...selected, content];
                    state.month = null; renderAudit();
                };
                host.appendChild(button);
            }
            document.getElementById('audit-content-all').onclick = () => { state.contents = null; state.month = null; renderAudit(); };
            document.getElementById('audit-content-none').onclick = () => { state.contents = []; state.month = null; renderAudit(); };
        }
        for (const edge of ['start', 'end']) {
            document.getElementById('audit-' + edge).onchange = event => {
                const value = event.target.value;
                const valid = validDate(value) && (edge === 'start' ? value <= state.end : value >= state.start)
                    && value >= AUDITS.metadata.historyStart && value <= iso(new Date());
                event.target.setCustomValidity(valid ? '' : 'Enter an ISO date within available history, with start on or before end.');
                if (!valid) { event.target.reportValidity(); return; }
                state[edge] = value; state.month = null; renderAudit();
            };
        }
        for (const [id, edge] of [['audit-from-slider', 'start'], ['audit-to-slider', 'end']]) {
            const slider = document.getElementById(id);
            slider.min = timestamp(AUDITS.metadata.historyStart) / DAY;
            slider.max = timestamp(iso(new Date())) / DAY;
            slider.step = 1;
            slider.onchange = () => {
                state[edge] = iso(new Date(Number(slider.value) * DAY));
                if (state.start > state.end) state[edge === 'start' ? 'end' : 'start'] = state[edge];
                state.month = null; renderAudit();
            };
        }
        document.getElementById('audit-month').onchange = event => { state.month = event.target.value || null; renderAudit(); };
        document.getElementById('audit-reset').onclick = () => { Object.assign(state, defaultDates(), {month: null}); renderAudit(); };
        document.getElementById('audit-clear').onclick = () => { state.month = null; auditTable.clearHeaderFilter(); renderAudit(); };
        document.getElementById('audit-csv').onclick = () => {
            const rows = auditTable.getData('active').map(({sourceResults, ...row}) => ({...row, methods: row.methods.join(' | ')}));
            downloadAudit('cycle-audits.csv', Papa.unparse(rows, {escapeFormulae: true}), 'text/csv');
        };
        document.getElementById('audit-json').onclick = () => downloadAudit('cycle-audits.json', JSON.stringify({metadata: AUDITS.metadata, selection: state, rows: auditTable.getData('active')}, null, 2), 'application/json');
        auditTable = new Tabulator('#audit-table', {data: [], layout: 'fitColumns', height: 410,
            pagination: 'local', paginationSize: 20, paginationSizeSelector: [20, 50, 100],
            placeholder: 'No audited cycles', initialSort: [{column: 'date', dir: 'desc'}],
            columnDefaults: {headerFilter: 'input', minWidth: 120, formatter: 'plaintext'},
            columns: [{title: 'Test date', field: 'date'}, {title: 'Equipment', field: 'equipment'},
                {title: 'Sample', field: 'sample', minWidth: 170}, {title: 'Cycle', field: 'description'},
                {title: 'Pass/Fail', field: 'outcome'}, {title: 'Cycle contents', field: 'cycleDescription'},
                {title: 'Details', headerFilter: false, formatter: () => '<button class="action" type="button">Details</button>', cellClick: (event, cell) => showAuditDetail(cell.getRow().getData())}],
            rowFormatter: row => row.getElement().classList.toggle('quality-row', row.getData().outcome === 'FAIL')});
        auditTable.on('tableBuilt', renderAudit);
    }
    function renderAudit() {
        if (!activeAudit || document.getElementById('audit-view').hidden || !auditTable) return;
        const state = auditStates[activeAudit];
        if (activeAudit === 'Sterilizer') {
            const buttons = [...document.querySelectorAll('#audit-contents button')];
            for (const button of buttons) button.setAttribute('aria-pressed', String(state.contents == null || state.contents.includes(button.dataset.content)));
            const selected = buttons.filter(button => button.getAttribute('aria-pressed') === 'true').length;
            document.getElementById('audit-content-count').textContent = selected + ' of ' + buttons.length + ' cycle contents selected';
        }
        const rangeRows = auditRows(activeAudit, state, false);
        const months = [...new Set(rangeRows.map(row => row.date.slice(0, 7)))].sort();
        if (state.month && !months.includes(state.month)) state.month = null;
        const rows = auditRows(activeAudit, state);
        const summary = auditSummary(rows);
        document.getElementById('audit-title').textContent = (state.equipment || 'All ' + activeAudit.toLowerCase() + 's') + ' | Cycle audits';
        document.getElementById('audit-month').innerHTML = '<option value="">All selected dates</option>' + months.map(month => '<option>' + month + '</option>').join('');
        document.getElementById('audit-month').value = state.month || '';
        for (const edge of ['start', 'end']) {
            const input = document.getElementById('audit-' + edge);
            input.value = state[edge]; input.setCustomValidity('');
        }
        document.getElementById('audit-from-slider').value = timestamp(state.start) / DAY;
        document.getElementById('audit-to-slider').value = timestamp(state.end) / DAY;
        document.getElementById('audit-range').textContent = state.start + ' through ' + state.end + (state.month ? ' | Month: ' + state.month : '') + ' | ' + (rows.length ? number(summary.failed) + ' failed / ' + number(summary.total) + ' audited (' + percent(summary.failed, summary.total) + ')' : 'No audited cycles');
        document.getElementById('audit-quality').textContent = 'Audit refresh: ' + new Date(AUDITS.metadata.extractedAt).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC') + '. Snapshot through ' + AUDITS.metadata.asOf + '. History from ' + AUDITS.metadata.historyStart + '. ' + number(AUDITS.metadata.issueSamples) + ' source samples have unresolved cycle-number prefixes, dates or outcomes and are excluded across the snapshot. Blank, non-Pass/Fail and unreleased results are excluded. Equipment is assigned by cycle-number prefix; 18, 29 and 32 are ovens.';
        const previousEnd = timestamp(state.start) - DAY;
        const span = timestamp(state.end) - timestamp(state.start);
        const previous = auditSummary(auditRows(activeAudit, {...state, start: iso(new Date(previousEnd - span)), end: iso(new Date(previousEnd)), month: null}));
        const metric = (title, value, detail) => '<div class="metric"><h3>' + title + '</h3><strong>' + value + '</strong><small>' + detail + '</small></div>';
        document.getElementById('audit-metrics').innerHTML = metric('Failed / total audited', number(summary.failed) + ' / ' + number(summary.total), activeAudit === 'Sterilizer' ? 'Unique samples; selected cycle contents' : 'Unique samples; all cycle types')
            + metric('Failure rate', percent(summary.failed, summary.total), 'Target: N/A (not supplied)')
            + metric('Passed cycles', number(summary.passed), percent(summary.passed, summary.total) + ' of audited samples')
            + metric('Failure-rate change', state.month || iso(new Date(previousEnd - span)) < AUDITS.metadata.historyStart || previous.rate === null || summary.rate === null ? 'N/A' : number(summary.rate - previous.rate) + ' pp', 'Versus preceding equal-length period; N/A with month filter or incomplete baseline');
        const comparisons = [['WoW', 7], ['MoM', 30], ['QoQ', 90], ['YoY', 365]].map(([label, days]) => label + ': ' + auditComparison(activeAudit, state, days)).join(' | ');
        document.getElementById('audit-insights').innerHTML = '<div><h3>Observations</h3><p>' + (rows.length ? number(summary.failed) + ' failed of ' + number(summary.total) + ' audited samples (' + percent(summary.failed, summary.total) + ').' : 'No audited cycles in this selection.') + '</p></div><div><h3>Assumptions</h3><p>One sample represents one audited cycle. Only released PASS/FAIL results count. Duplicate requests do not add cycles. Conflicting outcomes are excluded. No causes or acceptance targets are inferred.</p></div><div><h3>Recommendation</h3><p>' + (summary.failed ? 'Review failed sample details and the source investigation records.' : 'Review excluded records and confirm source coverage before drawing conclusions.') + ' Failure-rate changes (percentage points), trailing windows ending ' + state.end + ': ' + esc(comparisons) + '.</p></div>';
        auditTable.replaceData(rows);
        auditTrend?.destroy(); auditMonthly?.destroy();
        const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        const colors = ['#0072B2', '#D55E00'];
        const groups = ['PASS', 'FAIL'].map(outcome => rows.filter(row => row.outcome === outcome));
        auditTrend = new ApexCharts(document.getElementById('audit-trend'), {
            chart: {type: 'scatter', height: 310, animations: {enabled: false}, toolbar: {show: false}, events: {dataPointSelection: (event, chart, config) => {
                const row = groups[config.seriesIndex]?.[config.dataPointIndex]; if (row) showAuditDetail(row);
            }}}, series: groups.map((group, index) => ({name: index ? 'Fail' : 'Pass', data: group.map(row => ({x: timestamp(row.date), y: index ? 0 : 1}))})),
            colors, theme: {mode: theme}, noData: {text: 'No audited cycles'}, markers: {size: 5, strokeWidth: 1},
            xaxis: {type: 'datetime', min: timestamp(state.month ? rows[0]?.date || state.start : state.start), max: timestamp(state.month ? rows.at(-1)?.date || state.end : state.end) + DAY, labels: {format: 'yyyy-MM-dd', datetimeUTC: true}},
            yaxis: {min: -0.2, max: 1.2, tickAmount: 7, labels: {formatter: value => Math.abs(value) < 0.05 ? 'Fail' : Math.abs(value - 1) < 0.05 ? 'Pass' : ''}},
            tooltip: {custom: ({seriesIndex, dataPointIndex}) => {
                const row = groups[seriesIndex]?.[dataPointIndex];
                return row ? '<div style="padding:10px">' + esc(row.equipment + ' | ' + row.date + ' | ' + row.outcome) + '<br>' + esc(row.sample + ' | ' + row.description) + '</div>' : '';
            }} });
        auditTrend.render();
        const counts = months.map(month => auditSummary(rangeRows.filter(row => row.date.startsWith(month))));
        auditMonthly = new ApexCharts(document.getElementById('audit-monthly'), {
            chart: {type: 'bar', stacked: true, height: 310, animations: {enabled: false}, toolbar: {show: false}, events: {dataPointSelection: (event, chart, config) => {
                state.month = months[config.dataPointIndex] || null; renderAudit();
            }}}, series: [{name: 'Pass', data: counts.map(count => count.passed)}, {name: 'Fail', data: counts.map(count => count.failed)}],
            colors, theme: {mode: theme}, xaxis: {categories: months}, dataLabels: {enabled: false},
            yaxis: {title: {text: 'Audited cycles'}, decimalsInFloat: 0}, noData: {text: 'No audited cycles'},
            tooltip: {y: {formatter: (value, {dataPointIndex}) => number(value) + ' (' + percent(value, counts[dataPointIndex]?.total) + ')'}}});
        auditMonthly.render();
        document.getElementById('audit-month-note').textContent = number(rangeRows.length) + ' audited samples across the full date range. ' + (state.month ? 'Selected month: ' + state.month : 'All months selected.');
    }
    function setupAuditNavigation() {
        const panel = document.createElement('section');
        panel.id = 'audit-view'; panel.hidden = true; panel.setAttribute('role', 'region');
        document.getElementById('dashboard-content').appendChild(panel);
        populateAuditSelectors();
        for (const kind of ['Sterilizer', 'Oven']) document.getElementById(auditSelectId(kind)).onchange = event => {
            if (event.target.value) activateAudit(kind, event.target.value);
            else if (activeAudit === kind) event.target.value = auditStates[kind].equipment || 'all';
        };
    }
    function updateRefreshDate() {
        document.getElementById('refresh-date').textContent = new Date(SOURCE.metadata.extractedAt).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
        document.getElementById('snapshot-label').textContent = 'Snapshot through ' + SOURCE.metadata.asOf;
    }
    async function waitForOkta(status) {
        status.textContent = 'AWS session expired. Complete the Okta verification opened in your browser; the refresh will resume automatically.';
        const deadline = Date.now() + 310000;
        while (Date.now() < deadline) {
            await new Promise(resolve => setTimeout(resolve, 2000));
            const response = await fetch('/api/auth', {cache: 'no-store'});
            if (!response.ok) throw new Error('Local refresh service unavailable. Previous snapshot retained.');
            const auth = await response.json();
            if (auth.state === 'complete') return;
            if (auth.state !== 'pending') throw new Error((auth.message || 'Okta verification did not complete.') + ' Previous snapshot retained.');
        }
        throw new Error('Okta verification timed out. Previous snapshot retained.');
    }
    async function refreshData() {
        const button = document.getElementById('refresh-data');
        const status = document.getElementById('refresh-status');
        if (button.disabled) return;
        if (location.protocol === 'file:') {
            status.textContent = 'Live refresh requires the local dashboard service at http://127.0.0.1:8765/. No production query was run.';
            return;
        }
        button.disabled = true; button.setAttribute('aria-busy', 'true');
        status.textContent = 'Refreshing production samples, specifications and cycle audits...';
        try {
            const service = await fetch('/api/status', {cache: 'no-store'});
            if (!service.ok) throw new Error('Local refresh service unavailable.');
            const {refreshToken} = await service.json();
            const requestRefresh = () => fetch('/api/refresh', {method: 'POST', headers: {'X-FWN-Refresh': refreshToken}, cache: 'no-store'});
            let response = await requestRefresh();
            let data = await response.json();
            if (response.status === 401 && data.authRequired) {
                await waitForOkta(status);
                status.textContent = 'Okta verification complete. Refreshing production samples, specifications and cycle audits...';
                response = await requestRefresh();
                data = await response.json();
            }
            if (!response.ok) throw new Error(data.error || 'Refresh failed. Previous snapshot retained.');
            if (!data.metadata?.extractedAt || !Array.isArray(data.rows) || !data.rows.length || !Array.isArray(data.criteria)) throw new Error('Invalid refresh response. Previous snapshot retained.');
            if (!data.audits?.metadata?.extractedAt || !Array.isArray(data.audits.rows)) throw new Error('Audit refresh unavailable. Restart the local dashboard service.');
            const selections = Object.fromEntries(Object.entries(states).map(([water, state]) => [water, {lines: state.lines, test: state.test, units: state.units, start: state.start, end: state.end, month: state.month, released: state.released, collectionOnly: state.collectionOnly}]));
            for (const state of Object.values(states)) { state.chart?.destroy(); state.bars?.destroy(); state.table?.destroy(); }
            SOURCE = data; window.FWN_WATER = data; DASHBOARD_CONFIG.data = data; DASHBOARD_CONFIG.refreshDate = data.metadata.extractedAt;
            AUDITS = data.audits; window.FWN_AUDITS = AUDITS;
            populateAuditSelectors();
            if (activeAudit) buildAuditView();
            for (const {id: water} of DASHBOARD_CONFIG.tabs) setup(water, selections[water]);
            updateRefreshDate();
            status.textContent = 'Production refresh complete: ' + number(data.rows.length) + ' utility results and ' + number(AUDITS.rows.length) + ' audited cycles.';
        } catch (error) {
            status.textContent = error.message;
        } finally {
            button.disabled = false; button.removeAttribute('aria-busy');
        }
    }
    function setupUtilityNavigation() {
        const select = document.getElementById('utility-select');
        select.replaceChildren(...utilityOptions.map(tab => {
            const option = document.createElement('option');
            option.value = tab.id; option.textContent = tab.label;
            return option;
        }));
        const placeholder = document.createElement('option');
        placeholder.value = ''; placeholder.textContent = 'Select utility'; placeholder.disabled = true;
        select.prepend(placeholder);
        select.value = document.querySelector('.tab-content.active').id;
        document.querySelectorAll('.dashboard-tab').forEach(button => button.remove());
        const showUtility = () => {
            if (!select.value) return;
            activeAudit = null;
            const auditPanel = document.getElementById('audit-view');
            if (auditPanel) auditPanel.hidden = true;
            for (const kind of ['Sterilizer', 'Oven']) document.getElementById(auditSelectId(kind)).value = '';
            for (const tab of DASHBOARD_CONFIG.tabs) {
                const panel = document.getElementById(tab.id);
                const active = tab.id === select.value;
                panel.classList.toggle('active', active);
                panel.hidden = !active;
                panel.setAttribute('role', 'region');
                panel.removeAttribute('aria-labelledby');
                panel.setAttribute('aria-label', tab.label);
            }
            select.setAttribute('aria-controls', select.value);
            requestAnimationFrame(() => {
                const state = states[select.value];
                if (state?.table) { state.table.redraw(true); render(select.value); }
            });
        };
        select.addEventListener('change', showUtility);
        showUtility();
    }
    document.addEventListener('DOMContentLoaded', () => {
        try { if (!localStorage.getItem('echelon-theme')) localStorage.setItem('echelon-theme', 'light'); } catch (error) { }
        DashboardCore.init(DASHBOARD_CONFIG);
        updateRefreshDate();
        document.getElementById('refresh-data').addEventListener('click', refreshData);
        DashboardCharts.init(DASHBOARD_CONFIG);
        setupUtilityNavigation();
        setupAuditNavigation();
        document.getElementById('close-detail').addEventListener('click', () => document.getElementById('sample-detail').close());
        document.getElementById('sample-detail').addEventListener('keydown', event => {
            if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); event.currentTarget.close(); }
        });
        window.addEventListener('dashboardthemechange', () => { for (const water of Object.keys(states)) render(water); renderAudit(); });
        if (location.protocol !== 'file:') refreshData();
    });
    window.FWN_TEST = {defaultDates, validDate, selectRows, locationSeries, trendData, categoriesFor, acceptanceCriteria, mean, changeText, states, tabs: DASHBOARD_CONFIG.tabs, utilityOptions, auditRows, auditSummary, auditStates, auditContent, auditContentOptions};
    </script>
</body>
